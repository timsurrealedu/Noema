<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Noema Calendar · Mobile redesign</title>
<style>
:root{color-scheme:dark;--bg:#070b0b;--surface:#0d1515;--raised:#132020;--line:#273737;--ink:#edf5f4;--muted:#9aa9a8;--teal:#56c3bd;--teal-soft:#123735;--amber:#d8ae67;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--teal);outline-offset:3px}.phone{width:min(100%,430px);min-height:100dvh;margin:auto;padding:calc(env(safe-area-inset-top) + var(--s3)) var(--s4) calc(90px + env(safe-area-inset-bottom));background:var(--bg)}.top,.calendar-head,.detail-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}h1{margin:0;font-size:1.4rem;letter-spacing:-.03em}.icon,.sync{display:grid;place-items:center;min-width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:transparent}.icon{font-size:1.55rem}.sync{grid-auto-flow:column;gap:8px;padding:0 13px;font-weight:700}.sync svg{width:20px}.datebar{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:var(--s2);margin-top:var(--s4)}.month-label{display:flex;min-width:0;align-items:center;justify-content:center;gap:8px}.month-label strong{font-size:1.04rem}.month-label small,.detail-head small{color:var(--teal);font-size:.75rem;white-space:nowrap}.segmented{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:var(--s4);padding:3px;border:1px solid var(--line);border-radius:12px}.segmented button{min-height:38px;border:0;border-radius:8px;background:transparent;color:var(--muted)}.segmented button.active{background:var(--raised);color:var(--ink);font-weight:700}.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:var(--s4)}.weekstrip button{display:grid;place-items:center;gap:3px;min-height:58px;padding:5px 0;border:0;border-radius:12px;background:transparent;color:var(--muted);font-size:.7rem}.weekstrip b{display:grid;place-items:center;width:31px;height:31px;border-radius:50%;font-size:.88rem;color:var(--ink)}.weekstrip button.active{background:var(--teal-soft);color:var(--teal)}.weekstrip button.active b{background:var(--teal);color:#071010}.weekstrip button.today b{box-shadow:inset 0 0 0 1px var(--teal)}.calendar-head{margin-top:var(--s5);padding-bottom:var(--s2)}.calendar-head strong{font-size:.82rem;color:var(--muted)}.calendar-head button{border:0;background:transparent;color:var(--teal);font-size:.8rem;font-weight:700}.calendar-scroll{margin:0 calc(-1 * var(--s4));padding:0 var(--s4);overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x}.calendar-scroll::-webkit-scrollbar{display:none}.months{display:flex;width:max-content;gap:var(--s3)}.month{width:calc(100vw - 32px);max-width:398px;scroll-snap-align:start}.weekdays,.grid{display:grid;grid-template-columns:repeat(7,1fr)}.weekdays{margin-bottom:var(--s2)}.weekdays span{text-align:center;color:var(--muted);font-size:.68rem;font-weight:700}.day{position:relative;min-height:56px;padding:5px 3px;border:0;border-top:1px solid var(--line);border-right:1px solid var(--line);background:var(--surface);text-align:left;vertical-align:top}.day:nth-child(7n+1){border-left:1px solid var(--line)}.day:nth-last-child(-n+7){border-bottom:1px solid var(--line)}.day.empty{background:transparent}.day time{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:.75rem}.day.selected{background:#102625}.day.selected time{background:var(--teal);color:#071010;font-weight:800}.event{display:block;width:100%;margin-top:3px;overflow:hidden;color:var(--teal);font-size:.58rem;line-height:1.2;text-overflow:ellipsis;white-space:nowrap}.event.amber{color:var(--amber)}.hint{display:flex;align-items:center;justify-content:center;gap:7px;margin:var(--s3) 0 0;color:var(--muted);font-size:.72rem}.hint i{width:28px;height:1px;background:var(--line)}.detail{margin-top:var(--s5);border-top:1px solid var(--line)}.detail-head{padding:var(--s3) 0}.detail-head strong{font-size:.86rem}.schedule-wrap{overflow:auto;max-height:58dvh;overscroll-behavior:contain;border-top:1px solid var(--line);scrollbar-width:thin}.schedule{position:relative;display:grid;grid-template-columns:48px minmax(260px,1fr);min-height:960px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 59px,var(--line) 60px)}.hours{display:grid;grid-template-rows:repeat(16,60px);padding-right:8px;color:var(--muted);font-size:.67rem;text-align:right}.hours span{transform:translateY(-.55em)}.track{position:relative;border-left:1px solid var(--line)}.block{position:absolute;right:7px;left:7px;overflow:hidden;padding:6px 8px;border:0;border-radius:7px;background:var(--teal-soft);color:var(--ink);text-align:left}.block.task{background:#332919}.block time{display:block;color:var(--teal);font-size:.62rem}.block.task time{color:var(--amber)}.block strong{display:block;margin-top:2px;font-size:.72rem}.all-day{display:flex;gap:var(--s2);padding:var(--s2) 0;border-top:1px solid var(--line);overflow:auto}.all-day button{flex:none;min-height:30px;padding:4px 8px;border:0;border-radius:6px;background:#332919;color:var(--ink);font-size:.7rem}.week-grid{display:grid;grid-template-columns:48px repeat(7,minmax(96px,1fr));min-width:720px}.week-grid .week-label{padding:7px;text-align:center;border-bottom:1px solid var(--line);color:var(--muted);font-size:.68rem}.week-grid .week-label.active{color:var(--teal)}.week-grid .week-track{position:relative;min-height:960px;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 59px,var(--line) 60px)}.week-scroll{overflow:auto;max-height:58dvh;overscroll-behavior:contain;border-top:1px solid var(--line);scrollbar-width:thin}.empty-note{padding:var(--s5) 0;color:var(--muted);font-size:.82rem;text-align:center}.fab{position:fixed;right:max(var(--s4),calc((100vw - 430px)/2 + var(--s4)));bottom:calc(74px + env(safe-area-inset-bottom));display:grid;place-items:center;width:54px;height:54px;border:0;border-radius:50%;background:var(--teal);color:#061111;font-size:1.9rem;box-shadow:0 8px 18px #0008}.sheet{position:fixed;z-index:2;right:0;bottom:0;left:0;display:none;max-width:430px;margin:auto;padding:var(--s4) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--raised)}.sheet.open{display:block}.sheet h2{margin:0 0 var(--s2);font-size:1rem}.sheet p{margin:0 0 var(--s3);color:var(--muted);font-size:.82rem}.sheet input{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}.sheet div{display:flex;gap:var(--s2);margin-top:var(--s3)}.sheet button{min-height:44px;padding:0 15px;border:0;border-radius:10px;background:var(--teal);color:#071010;font-weight:800}.sheet button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.toast{position:fixed;z-index:3;left:50%;bottom:145px;display:none;transform:translateX(-50%);padding:9px 12px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:.78rem}.toast.show{display:block}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<main class="phone">
  <header class="top"><h1>Calendar</h1><button class="sync" aria-label="Sync calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7h-5V2M4 17h5v5M20 7a8 8 0 0 0-14-3M4 17a8 8 0 0 0 14 3"/></svg>Sync</button></header>
  <nav class="datebar" aria-label="Month navigation"><button class="icon" id="previous" aria-label="Previous month">‹</button><button class="month-label" id="today"><strong id="monthLabel">August 2026</strong><small>Today</small></button><button class="icon" id="next" aria-label="Next month">›</button></nav>
  <nav class="segmented" aria-label="Calendar view"><button data-view="Day">Day</button><button data-view="Week">Week</button><button class="active" data-view="Month">Month</button><button data-view="Agenda">Agenda</button></nav>
  <section class="weekstrip" aria-label="Selected week"><button><span>Mon</span><b>17</b></button><button><span>Tue</span><b>18</b></button><button><span>Wed</span><b>19</b></button><button class="today"><span>Thu</span><b>20</b></button><button class="active"><span>Fri</span><b>21</b></button><button><span>Sat</span><b>22</b></button><button><span>Sun</span><b>23</b></button></section>
  <section id="monthView"><div class="calendar-head"><strong>August · events and tasks</strong><button id="jump">Jump to today</button></div><section class="calendar-scroll" id="scroll" aria-label="Swipe between calendar months"><div class="months" id="months"></div></section><p class="hint"><i></i>Swipe for another month<i></i></p></section>
  <section class="detail" id="detail" aria-live="polite"></section>
  <button class="fab" id="add" aria-label="Add event">+</button>
  <form class="sheet" id="sheet"><h2>New event</h2><p>Starts on the selected day.</p><input required placeholder="What’s happening?" autofocus><div><button>Save event</button><button class="secondary" type="button" id="cancel">Cancel</button></div></form><output class="toast" id="toast"></output>
</main>
<script>
const months=document.querySelector('#months'),label=document.querySelector('#monthLabel'),scroll=document.querySelector('#scroll'),toast=document.querySelector('#toast'),sheet=document.querySelector('#sheet'),detail=document.querySelector('#detail'),monthView=document.querySelector('#monthView');let cursor=new Date(2026,7,1),selected=21,view='Month';
const names=['January','February','March','April','May','June','July','August','September','October','November','December'],days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const items=[{day:20,time:'All day',title:'Indonesia Independence',kind:'event',detail:'Public holiday'},{day:21,time:'09:30',start:570,duration:45,title:'Design review',kind:'event',detail:'Studio',recurring:true},{day:21,time:'14:00',start:840,duration:45,title:'Read & annotate',kind:'task',detail:'Study'},{day:21,time:'Due today',title:'Submit research outline',kind:'task',detail:'No time scheduled'},{day:22,time:'10:00',start:600,duration:90,title:'Architecture lab',kind:'event',detail:'Room B',recurring:true},{day:24,time:'08:30',start:510,duration:30,title:'Plan next week',kind:'task',detail:'30 min'}],current=()=>items.filter(item=>item.day===selected),timed=rows=>rows.filter(item=>item.start!=null),allDay=rows=>rows.filter(item=>item.start==null),block=item=>`<button class="block ${item.kind}" style="top:${item.start-480}px;height:${Math.max(30,item.duration)}px"><time>${item.time} · ${item.duration} min</time><strong>${item.title}${item.recurring?' ↻':''}</strong></button>`;
function month(date){const y=date.getFullYear(),m=date.getMonth(),start=(new Date(y,m,1).getDay()+6)%7,total=new Date(y,m+1,0).getDate(),box=document.createElement('section');box.className='month';box.innerHTML=`<div class="weekdays">${days.map(d=>`<span>${d}</span>`).join('')}</div><div class="grid">${Array.from({length:42},(_,i)=>{const n=i-start+1,valid=n>0&&n<=total,rows=m===7&&valid?items.filter(item=>item.day===n).slice(0,2):[];return `<button class="day ${valid?'':'empty'} ${n===selected&&m===cursor.getMonth()?'selected':''}" ${valid?'':'disabled'} data-day="${n}"><time>${valid?n:''}</time>${rows.map(item=>`<span class="event ${item.kind==='task'?'amber':''}">${item.kind==='task'?'□ ':''}${item.title}</span>`).join('')}</button>`}).join('')}</div>`;return box}
function schedule(rows){return `<div class="all-day">${allDay(rows).map(item=>`<button>□ ${item.title}</button>`).join('')}</div><div class="schedule-wrap"><div class="schedule"><div class="hours">${Array.from({length:16},(_,i)=>`<span>${String(i+8).padStart(2,'0')}:00</span>`).join('')}</div><div class="track">${timed(rows).map(block).join('')}</div></div></div>`}function renderDetail(){const date=`${names[cursor.getMonth()]} ${selected}`;if(view==='Month'){monthView.hidden=false;detail.innerHTML='';return}monthView.hidden=true;if(view==='Week'){const first=selected-((new Date(cursor.getFullYear(),cursor.getMonth(),selected).getDay()+6)%7),week=Array.from({length:7},(_,i)=>first+i);detail.innerHTML=`<header class="detail-head"><strong>This week</strong><small>Scroll sideways + down</small></header><div class="all-day">${week.flatMap(day=>allDay(items.filter(item=>item.day===day))).map(item=>`<button>□ ${item.title}</button>`).join('')}</div><div class="week-scroll"><div class="week-grid"><span></span>${week.map(day=>`<button class="week-label ${day===selected?'active':''}" data-day="${day}">${days[(new Date(cursor.getFullYear(),cursor.getMonth(),day).getDay()+6)%7]} ${day}</button>`).join('')}<div class="hours">${Array.from({length:16},(_,i)=>`<span>${String(i+8).padStart(2,'0')}:00</span>`).join('')}</div>${week.map(day=>`<div class="week-track">${timed(items.filter(item=>item.day===day)).map(block).join('')}</div>`).join('')}</div></div>`;return}if(view==='Day'){detail.innerHTML=`<header class="detail-head"><strong>${date}</strong><small>Timed schedule</small></header>${schedule(current())}`;return}detail.innerHTML=`<header class="detail-head"><strong>Upcoming</strong><small>Events + tasks</small></header>${schedule(items.filter(item=>item.day>=selected))}`}
function render(center=true){months.replaceChildren(month(cursor),month(new Date(cursor.getFullYear(),cursor.getMonth()+1,1)));label.textContent=`${names[cursor.getMonth()]} ${cursor.getFullYear()}`;if(center)scroll.scrollLeft=0;renderDetail()}
function shift(n){cursor=new Date(cursor.getFullYear(),cursor.getMonth()+n,1);render()}function say(text){toast.value=text;toast.textContent=text;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
document.querySelector('#previous').onclick=()=>shift(-1);document.querySelector('#next').onclick=()=>shift(1);document.querySelector('#today').onclick=document.querySelector('#jump').onclick=()=>{cursor=new Date(2026,7,1);selected=21;render();say('Back to today')};document.querySelector('#add').onclick=()=>sheet.classList.add('open');document.querySelector('#cancel').onclick=()=>sheet.classList.remove('open');sheet.onsubmit=e=>{e.preventDefault();sheet.classList.remove('open');say('Event saved for August 21')};document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>{view=button.dataset.view;document.querySelectorAll('[data-view]').forEach(item=>item.classList.toggle('active',item===button));render()});document.querySelector('.weekstrip').onclick=e=>{const button=e.target.closest('button');if(!button)return;selected=+button.querySelector('b').textContent;render(false)};document.addEventListener('click',e=>{const day=e.target.closest('.day[data-day],.week-summary [data-day]');if(!day)return;selected=+day.dataset.day;render(false);say(`Selected ${names[cursor.getMonth()]} ${selected}`)});render();
</script>
</html>
